# oml-code settings
oml-code:
  schemaVersion: 1

# project npm settings
project:
  name: "@oml/cams"
  version: 0.1.0
  title: CAMS
  description: Ontologies related to Collaborative Autonomy Management Systems.

# source folders
sources:
  - src

# packing settings
pack:
  - include: [src/method]
    exclude:
      - "**/__pycache__/**"
      - "**/*.pyc"

# Default CLI arguments per command
defaults:
  export: -o build/owl
  reason: -o build/owl -t
  pack: -o build/dist
