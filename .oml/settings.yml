# oml-code settings
oml-code:
  schemaVersion: 1

# project npm settings
project:
  name: "@oml/cams"
  version: 1.0.0
  title: CAMS
  description: Ontologies related to Collaborative Autonomy Management Systems.

# source folders
sources:
  - src

# packing settings
pack:
  - include: [src/method]
    exclude:
      - "**/__pycache__/**"
      - "**/*.pyc"

# Default CLI arguments per command
defaults:
  render: -m src/model/md -b build/web -c src/model/oml/example.com/cams/denied/project/bundle.oml
  export: -o build/owl
  reason: -o build/owl -t
  pack: -o build/dist
